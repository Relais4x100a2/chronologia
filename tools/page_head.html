<title>Schéma Événement–Masque–Factoïde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#1b2230; --muted:#5a6475; --line:#d9dde4;
  --accent:#23406e;
  --src:#8a5a14; --src-bg:#f6ecdc;
  --evt:#16676b; --evt-bg:#dff0ef;
  --int:#5a4796; --int-bg:#ebe7f6;
  --ref:#6b7383; --ref-bg:#eceef2;
  --code-bg:#eef0f4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12161d; --surface:#1a2029; --ink:#e6e9ef; --muted:#9aa3b2; --line:#2c3440;
    --accent:#8fb0e6;
    --src:#e0b066; --src-bg:#2f2515;
    --evt:#6fcfc9; --evt-bg:#143032;
    --int:#b3a4f0; --int-bg:#262040;
    --ref:#a6aebb; --ref-bg:#232a35;
    --code-bg:#20262f;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12161d; --surface:#1a2029; --ink:#e6e9ef; --muted:#9aa3b2; --line:#2c3440;
  --accent:#8fb0e6;
  --src:#e0b066; --src-bg:#2f2515;
  --evt:#6fcfc9; --evt-bg:#143032;
  --int:#b3a4f0; --int-bg:#262040;
  --ref:#a6aebb; --ref-bg:#232a35;
  --code-bg:#20262f;
}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
h1,h2,h3{font-family:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:clamp(28px,5vw,40px);font-weight:700;letter-spacing:-.01em}
h2{font-size:24px;font-weight:600;margin-bottom:14px}
h3{font-size:17px;font-weight:600}
p{margin:0 0 10px;max-width:68ch}
.eyebrow{font:500 12px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.lede{color:var(--muted);font-size:16px;margin-top:12px}
code,.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:.88em}
code{background:var(--code-bg);padding:1px 5px;border-radius:3px}
.chain{margin-top:18px;font:500 13px/1.8 "IBM Plex Mono",ui-monospace,monospace;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto;white-space:nowrap}

/* layers */
.layers{display:grid;gap:10px}
.layer{border-radius:6px;padding:14px 16px;display:grid;grid-template-columns:200px 1fr;gap:6px 18px;align-items:start}
.layer.src{background:var(--src-bg)} .layer.evt{background:var(--evt-bg)} .layer.int{background:var(--int-bg)} .layer.ref{background:var(--ref-bg)}
.layer .name{font:600 15px/1.3 "IBM Plex Sans Condensed",sans-serif}
.layer.src .name{color:var(--src)} .layer.evt .name{color:var(--evt)} .layer.int .name{color:var(--int)} .layer.ref .name{color:var(--ref)}
.layer .ents{display:flex;flex-wrap:wrap;gap:6px}
.layer .ents span{font:500 12px/1 "IBM Plex Mono",monospace;background:var(--surface);border:1px solid var(--line);padding:5px 7px;border-radius:3px}
.layer .desc{grid-column:2;color:var(--muted);font-size:13.5px;margin:0}
@media (max-width:640px){.layer{grid-template-columns:1fr}.layer .desc{grid-column:1}}

.diagram{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;overflow-x:auto}
.diagram pre{margin:0;min-width:760px}
.note{font-size:13px;color:var(--muted);margin-top:8px}

/* dictionary */
.dict{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.ent{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ent header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ent .en{font:600 14px/1.2 "IBM Plex Mono",monospace}
.chip{font:500 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:3px;white-space:nowrap}
.chip.src{color:var(--src);background:var(--src-bg)} .chip.evt{color:var(--evt);background:var(--evt-bg)} .chip.int{color:var(--int);background:var(--int-bg)} .chip.ref{color:var(--ref);background:var(--ref-bg)}
.ent p{font-size:13.5px;margin:0;color:var(--muted)}
.ent ul{margin:0;padding:0;list-style:none;font:12.5px/1.65 "IBM Plex Mono",monospace}
.ent li b{font-weight:500;color:var(--ink)}
.ent li span{color:var(--muted)}

/* rules */
.rules{display:grid;gap:10px;counter-reset:r}
.rule{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.rule .n{font:600 13px/1.5 "IBM Plex Mono",monospace;color:var(--accent)}
.rule h3{margin-bottom:4px}
.rule p{margin:0;font-size:14px;color:var(--muted)}

/* tables */
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font:600 12px/1.3 "IBM Plex Sans Condensed",sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg)}
td:first-child{font-family:"IBM Plex Mono",monospace;font-weight:500;white-space:nowrap}
tr:last-child td{border-bottom:0}
.quote{font-family:"IBM Plex Sans",serif;font-style:italic;background:var(--surface);border-left:3px solid var(--src);padding:12px 16px;border-radius:0 6px 6px 0;max-width:72ch;margin-bottom:14px}
.quote .cote{display:block;font:500 12px/1.4 "IBM Plex Mono",monospace;font-style:normal;color:var(--muted);margin-top:8px}
.ex td:first-child{white-space:normal}
.pill{display:inline-block;font:500 11px/1 "IBM Plex Mono",monospace;padding:3px 6px;border-radius:3px;margin:1px 0}
.pill.ok{background:var(--evt-bg);color:var(--evt)} .pill.mid{background:var(--src-bg);color:var(--src)} .pill.no{background:var(--ref-bg);color:var(--ref);text-decoration:line-through}
footer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

/* v0.2 additions */
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.toc a{font:500 12.5px/1 "IBM Plex Mono",monospace;color:var(--accent);text-decoration:none;border:1px solid var(--line);background:var(--surface);padding:8px 10px;border-radius:4px}
.toc a:hover,.toc a:focus-visible{border-color:var(--accent);outline:none}
.part{font:600 12px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.sub{font:600 18px/1.3 "IBM Plex Sans Condensed",sans-serif;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.refs{display:grid;gap:10px}
.ref{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;grid-template-columns:34px 1fr;gap:4px 12px}
.ref.new{border-color:var(--src)}
.ref .n{font:600 13px/1.5 "IBM Plex Mono",monospace;color:var(--accent)}
.ref .t{font-weight:600;font-size:14.5px;line-height:1.45}
.ref .t i{font-weight:400}
.ref .nat{font:500 11px/1 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 0 8px}
.ref dl{margin:0;display:grid;grid-template-columns:78px 1fr;gap:4px 10px;font-size:13.5px}
.ref dt{font:500 11.5px/1.7 "IBM Plex Mono",monospace;color:var(--muted)}
.ref dd{margin:0}
@media (max-width:560px){.ref dl{grid-template-columns:1fr}.ref dt{margin-top:4px}}
pre.code{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto;font:12.5px/1.6 "IBM Plex Mono",ui-monospace,monospace;margin:0 0 14px;color:var(--ink)}
pre.code .c{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.box h3{margin-bottom:8px}
.box ul{margin:0;padding-left:18px;font-size:14px}
.box li{margin-bottom:6px}
.box.plus{border-top:3px solid var(--evt)} .box.minus{border-top:3px solid var(--src)}
.verdict{background:var(--int-bg);border-radius:6px;padding:14px 16px;margin-top:12px}
.verdict h3{color:var(--int);margin-bottom:6px}
.steps{display:grid;gap:0;counter-reset:s}
.step{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.step .n{font:600 13px/1.5 "IBM Plex Mono",monospace;color:var(--evt)}
.step h3{margin-bottom:4px}
.step p{margin:0;font-size:14px;color:var(--muted)}
.gap td:nth-child(3){color:var(--muted)}
.badge{display:inline-block;font:500 10.5px/1 "IBM Plex Mono",monospace;padding:3px 5px;border-radius:3px;background:var(--src-bg);color:var(--src);vertical-align:2px;margin-left:6px}

.doc{max-width:900px;margin:0 auto}
.doc h1{margin-bottom:10px}
.doc h2{margin:48px 0 14px;padding-top:14px;border-top:2px solid var(--ink)}
.doc h3{font-size:19px;margin:30px 0 10px}
.doc h4{font-size:16px;margin:24px 0 8px;font-family:"IBM Plex Sans Condensed",sans-serif}
.doc p,.doc li{max-width:72ch}
.doc ul,.doc ol{padding-left:22px;margin:0 0 14px}
.doc li{margin-bottom:6px}
.doc blockquote{margin:0 0 16px;background:var(--surface);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 6px 6px 0}
.doc blockquote p{margin:0 0 6px}
.doc hr{border:0;border-top:1px solid var(--line);margin:36px 0}
.doc .tbl{margin:0 0 16px}
.doc table{min-width:640px}
.doc td:first-child{white-space:normal}
.doc pre.code code{background:none;padding:0;font-size:12.5px}
.doc a{color:var(--accent)}
.doc strong{font-weight:600}
</style>
