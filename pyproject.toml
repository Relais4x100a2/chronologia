[project]
name = "chronologia"
version = "0.0.0"
description = "Chronologia : modèle événement–masque–factoïde et connecteurs d'import"
requires-python = ">=3.12"
dependencies = ["geneweb-py"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10"]

# Le parseur GeneWeb vit dans le dépôt toldot (source unique), en dépendance locale.
[tool.uv.sources]
geneweb-py = { path = "../toldot/core", editable = true }

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["chronologia"]
